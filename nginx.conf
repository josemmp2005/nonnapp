# Configuración de nginx del contenedor `web`: sirve la SPA y manda cualquier
# ruta a `index.html` para que funcione React Router.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (React Router resuelve /app, /auth, /verify-email, etc. en el cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# CI de GitHub Actions: en cada push y PR pasa typecheck, lint, build y tests
# del frontend, y typecheck, build y tests del backend (con Postgres real).

name: CI

on:
  push:
    branches: [main, postgres-local-auth]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sabora
          POSTGRES_PASSWORD: sabora
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Sobreescribe lo que trae server/.env.test (pensado para el Postgres
      # local de docker-compose en :5434) para apuntar al servicio de esta
      # Action, en :5432 — dotenv no pisa variables que ya estén puestas.
      DATABASE_URL: postgres://sabora:sabora@localhost:5432/sabora_test
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck:test
      - run: npm run build
      - run: npm test
